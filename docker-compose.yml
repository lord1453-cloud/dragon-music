version: '3.8'

services:
  # 🐲 Ejderha Telegram Botu
  bot:
    build: .
    container_name: ejderha_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt:ro
    command: ["python", "main.py"]

  # 🌐 Harici Web Admin Paneli
  panel:
    build: .
    container_name: ejderha_panel
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    command: ["python", "panel_server.py"]
    depends_on:
      - bot
